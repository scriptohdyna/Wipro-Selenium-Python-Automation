; ----------------------------------------------------------------------------
; config.ini
; Central configuration for the ECommerce Selenium Automation Framework.
; Edit the values below instead of hard-coding them inside test/page files.
; ----------------------------------------------------------------------------

[environment]
; Base URL of the application under test
base_url = https://tutorialsninja.com/demo/

[browser]
; Supported: chrome (framework is currently built/tested only for Chrome)
name = chrome
; Run Chrome without a visible window (true/false). Keep false while learning,
; switch to true later once your tests are stable.
headless = false
; Implicit wait, in seconds, applied to the WebDriver (kept small on purpose;
; most waits in this framework are EXPLICIT waits inside base_page.py)
implicit_wait = 5
; Max time, in seconds, that explicit (WebDriverWait) waits will wait for
; an element before timing out
explicit_wait = 15
; Window size used when not running headless
window_width = 1366
window_height = 768

[credentials]
; --------------------------------------------------------------------------
; PLACEHOLDER credentials only. Do NOT put a real email/password here.
; These are intentionally invalid so the login test can verify that the
; application correctly REJECTS a bad login (see tests/test_login.py).
; If you later add a real test account of your own, replace these values
; locally and keep this file out of version control (see .gitignore).
; --------------------------------------------------------------------------
invalid_email = not_a_real_user@example.com
invalid_password = ThisIsNotARealPassword123!

[paths]
; Relative paths (relative to the project root) - do NOT hard-code
; a Windows username or absolute path here.
screenshots_dir = screenshots
reports_dir = reports
test_data_csv = data/test_data.csv
